[package]
name = "sourcetrait_ronx"
version = "3.2.1"
description = "Extended RON library for SourceTrait Common"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later WITH GPL-3.0-linking-source-exception"
repository = "https://github.com/sourcetrait/sourcetrait_common"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "common", "ronx"]
edition = "2024"

[dependencies]
ron.workspace = true
serde.workspace = true
thiserror.workspace = true
sourcetrait_stdx.workspace = true
regex.workspace = true
hashlink = { version = "0.10.0", features = ["serde"] }
erased-serde = "0.4.8"
serde-value = "0.7.0"
sourcetrait_ronx_macro = { path = "../sourcetrait_ronx_macro" }

[dev-dependencies]
sourcetrait_testing.workspace = true
serde.workspace = true
ron.workspace = true
pretty_assertions.workspace = true
