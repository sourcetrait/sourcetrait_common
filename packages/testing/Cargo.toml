[package]
name = "asmov-common-testing"
version = "3.0.0"
description = "Structured testing in sequence with fixture and temp directories"
authors = ["Asmov LLC <development.pub@asmov.software>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/asmov/common"
homepage = "https://asmov.software"
categories = ["development-tools::testing"]
keywords = ["integration", "unit", "benchmark", "test", "tests"]
edition = "2024"

[dependencies]
asmov-common-testing-macro = { version="1.0.0", path = "../testing-macro" }
anyhow = "1"
function_name = "0.3"
rand = "0.9"
regex = "1"
shutdown_hooks = "0.1"
chrono = "0.4"
tar = "0.4"
filetime = "0.2"
uu_touch = "0.0.30"

[[example]]
name = "example-fibonacci"
test = true
