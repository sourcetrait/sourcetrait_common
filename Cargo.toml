[workspace]
members = [
    "crates/sourcetrait_chronox",
    "crates/sourcetrait_clapx",
    "crates/sourcetrait_ronx",
    "crates/sourcetrait_ronx_macro",
    "crates/sourcetrait_stdx",
    "crates/sourcetrait_tomlx",
    "crates/sourcetrait_tooling",
    "crates/sourcetrait_testing",
    "crates/sourcetrait_testing_macro",
    "crates/draft/sourcetrait_gitparity",
    "crates/draft/sourcetrait_dotrepo",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc","std","clock","now"] }
clap = { version = "4.5", features = ["derive"] }
derive_builder = "0.20"
env_logger = "0.11"
function_name = "0.3"
indexmap = "2.10"
indoc = "2"
log = "0.4"
pretty_assertions = "1.4.1"
proc-macro2 = "1"
quote = "1"
regex = "1"
ron = "0.10"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
stabby = { version = "72.1" }
strum = { version = "0.27", features = ["derive"] }
syn = { version = "2", features=["full"] }
thiserror = "2"
toml = "0.8"
walkdir = "2.5"

[workspace.dependencies.sourcetrait_stdx]
version = "1"
path = "crates/sourcetrait_stdx"

[workspace.dependencies.sourcetrait_testing]
path = "crates/sourcetrait_testing"
