[package]
name = "asmov-common-testing"
version = "3.1.0"
description = "Structured testing with setup, teardown, and standardized fixture and temp directories"
authors = ["Asmov LLC <development.pub@asmov.software>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/asmov/common"
homepage = "https://asmov.software"
categories = ["development-tools::testing"]
keywords = ["test", "unit", "integration", "benchmark"]
edition = "2024"

[dependencies]
asmov-common-testing-macro = { version="1.0.0", path = "../testing-macro" }
asmov-common-tooling = { optional = true, version="0.0.1" }
anyhow = "1"
function_name = "0.3"
rand = "0.9"
regex = "1"
shutdown_hooks = "0.1"

[features]
#default = []
default = ["tooling"]
tooling = ["asmov-common-tooling"]

[[example]]
name = "example-fibonacci"
test = true
