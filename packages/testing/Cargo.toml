[package]
name = "asmov-common-testing"
version = "2.1.5"
description = "Structured unit and integration testing library"
authors = ["Asmov LLC <development.pub@asmov.software>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/asmov/common"
homepage = "https://github.com/asmov/common/tree/dev/testing"
categories = ["development-tools::testing"]
keywords = ["integration", "unit", "benchmark", "test", "tests"]
edition = "2021"

[dependencies]
anyhow = "1"
function_name = "0.3"
futures = "0.3"
lazy_static = "1"
once_cell = "1"
rand = "0.9"
regex = "1"
shutdown_hooks = "0.1"
sysinfo = "0.34"

[dev-dependencies]
lazy_static = "1.4.0"

[[example]]
name = "typical"
test = true
