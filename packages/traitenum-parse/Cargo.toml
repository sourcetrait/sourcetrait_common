[package]
name = "asmov-common-traitenum-parse"
version = "1.0.0"
description = "Parsing library for Asmov Common Traitenum"
authors = ["Asmov LLC <development.pub@asmov.software>"]
repository = "https://github.com/asmov/common"
homepage = "https://asmov.software"
license = "AGPL-3.0-or-later"
keywords = ["enum", "trait", "asmov"]
categories = []
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
syn = { version = "2", features = ["full"] }
proc-macro2 = "1"
quote = "1"
bincode = "1"
convert_case = "0"
thiserror = "1"
