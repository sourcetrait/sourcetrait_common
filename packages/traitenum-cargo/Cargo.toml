[package]
name = "asmov-common-traitenum-cargo"
version = "1.0.0"
description = "Cargo subcommands to generate traitenum traits and derive macros"
authors = ["Asmov LLC <development.pub@asmov.software>"]
repository = "https://github.com/asmov/common"
homepage = "https://github.com/asmov/common/tree/dev/traitenum"
license = "AGPL-3.0-or-later"
keywords = ["enum", "trait", "asmov"]
categories = []
edition = "2021"

[[bin]]
name = "cargo-traitenum"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
convert_case = "0"
proc-macro2 = "1"
quote = "1"
rustfmt = "0"
syn = { version = "2", features = ["full"] }
thiserror = "1"
toml = { version = "0", features = ["display"] }
