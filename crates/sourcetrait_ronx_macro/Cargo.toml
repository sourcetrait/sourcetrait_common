[package]
name = "sourcetrait_ronx_macro"
version = "1.1.1"
description = "Macro exports for SourceTrait Common RonX"
authors = ["SourceTrait <development@sourcetrait.com>"]
repository = "https://github.com/sourcetrait/sourcetrait_common"
homepage = "https://sourcetrait.com"
license = "AGPL-3.0-or-later WITH GPL-3.0-linking-source-exception"
keywords = ["sourcetrait", "common", "ronx"]
categories = []
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
syn = { workspace = true, features=["full", "extra-traits"] }
quote.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
