[package]
name = "srctrait-common"
version = "1.0.0"
description = "Common libraries for SourceTrait projects"
authors = ["SourceTrait <development@sourcetrait.com"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/srctrait-common"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "srctrait"]
edition = "2024"

[dependencies]
srctrait-common-stdx = { optional = true, version="1", path="../srctrait-common-stdx" }
srctrait-common-tooling = { optional = true, version="1", path="../srctrait-common-tooling" }

[features]
default = []
stdx = ["srctrait-common-stdx"]
tooling = ["srctrait-common-tooling"]

[dev-dependencies]
srctrait-common-testing = { version = "4", path = "../testing/srctrait-common-testing" }
