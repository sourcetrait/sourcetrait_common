[package]
name = "sourcetrait_gitparity"
version = "0.1.0"
description = "Git operations with parity between CLI and LibGit2"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later WITH GPL-3.0-linking-source-exception"
repository = "https://github.com/sourcetrait/sourcetrait_common"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "common", "gitparity"]
edition = "2024"

[dependencies]
const_format = "0.2"
chrono.workspace = true
derive_builder.workspace = true
git2 = { version = "0.20", optional = true }
indoc.workspace = true
splitty = "1.0"
sourcetrait_stdx.workspace = true
strum.workspace = true
thiserror.workspace = true
url = "2.5.4"
# testlib
sourcetrait_testing = { workspace = true, optional = true }
hex = "0.4.3"

[features]
default = [ "libc" ]
#default = [ "libc", "nightly" ]
libc = [ "dep:git2" ]
nightly = []
testlib = ["dep:sourcetrait_testing"]

[dev-dependencies]
env_logger.workspace = true 
log.workspace = true
sourcetrait_gitparity = { path = ".", features = ["testlib"] }
sourcetrait_testing.workspace = true
sourcetrait_stdx.workspace = true
